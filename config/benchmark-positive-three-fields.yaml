schema_version: 1
name: benchmark-positive-three-fields

domains:
  - id: mathematics
    query: >-
      Find important mathematics papers whose dedicated LKM open_questions are
      likely to contain an explicit finite counterexample, exact construction,
      replayable certificate, or bounded formal statement. Prefer atomic
      conjectures over broad future-work programs. Return papers only; the
      pipeline will extract open_questions through the direct paper-graph API.
    seed_papers:
      - paper_id: "1075662826585980934"
        doi: ""
        title: ""
      - paper_id: "1286283772110569517"
        doi: ""
        title: ""
