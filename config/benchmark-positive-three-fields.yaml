      - paper_id: "812575677793435649"
        doi: ""
        title: ""
      - paper_id: "918568905801203717"
        doi: ""
        title: ""
      - paper_id: "813031540849115137"
        doi: ""
        title: ""
      - paper_id: "867770472262009700"
        doi: ""
        title: ""

  - id: computational-science
    query: >-
      Find important computational-science papers whose dedicated LKM
      open_questions explicitly ask for an executable algorithm, certified
      numerical method, exact complexity or convergence certificate, or
      performance on a source-grounded fixed benchmark with a scientifically
      meaningful success predicate. Exclude vague calls for more robust,
      scalable, or accurate models unless the source itself defines the data,
      metric, comparison, and claim boundary. Return papers only.
    seed_papers: []

limits:
  papers_per_domain: 10
  questions_per_domain: 50
  lkm_timeout_seconds: 60

agents:
  model: ""
  codex_executable: codex
  networked_sandbox: workspace-write
  network_access: true
  sandbox: read-only
  timeout_seconds: 3600

outputs:
  runs_root: ../../open-research-problem-pool/campaigns
  problem_root: ../..
  pool_root: ../../open-research-problem-pool
