      - paper_id: "867773502592123092"
        doi: ""
        title: ""

  - id: physics
    query: >-
      Find important theoretical or computational physics papers whose
      dedicated LKM open_questions are likely to ask for an exact finite
      spectrum, explicit state or code, counterexample, reproducible finite-size
      certificate, or quantitatively fixed simulation result. Prefer atomic
      targets over mechanism narratives. Return papers only.
    seed_papers:
      - paper_id: "867748844715114982"
        doi: ""
        title: ""
      - paper_id: "867759171204809144"
        doi: ""
