schema_version: 2
name: quantum-many-body-open-problems

topics:
  - id: quantum-many-body
    title: Quantum Many-Body Physics
    query: >-
      Find context-grounded, currently open research problems in quantum
      many-body physics. Preserve the source's actual scope and keep each
      problem's acceptance standard unambiguous.
    sources:
      - lkm_open_questions
      - topic_search
    seed_papers: []
    seed_references:
      - kind: book
        title: 10000 Scientific Problems — Physics Volume
        identifier: private-reference
        url: ''
        locator: table of contents and relevant chapter
        excerpt: ''

limits:
  questions_per_domain: 20
  lkm_timeout_seconds: 60
  # Campaigns always record the 0-10 verification difficulty but do
  # not use it as a publication threshold.

agents:
  model: ''
  codex_executable: codex
  networked_sandbox: workspace-write
  network_access: true
  workers: 4
  networked_workers: 4
  retries: 1
  retry_backoff_seconds: 5
  sandbox: read-only
  timeout_seconds: 3600

outputs:
  runs_root: ../../open-research-problem-pool/campaigns
  problem_root: ../..
  pool_root: ../../open-research-problem-pool
