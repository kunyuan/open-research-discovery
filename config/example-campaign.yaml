schema_version: 1
name: quantum-information-open-problems

domains:
  - id: quantum-information
    query: >-
      Identify scientifically important, concrete open research problems in
      quantum information with enough context to define an unambiguous answer
      and verification contract.
    seed_papers: []

# Omit this list to preserve the legacy explicit-open-question path exactly.
# Multiple strategies may contribute CandidateSeed records to the same shared
# canonicalization, Research, Reviewer, scoring, and compiler stages.
strategies:
  - type: lkm_explicit_open_questions
  - type: lkm_topic_decomposition
    search_groups: 4
    sources: [lkm, web]
    max_candidates_per_domain: 12

# Research at most 2N candidates, then compile at most N diverse accepted ones.
selection:
  target_problem_count: 6
  shortlist_multiplier: 2

limits:
  papers_per_domain: 10
  questions_per_domain: 100
  lkm_timeout_seconds: 60

agents:
  model: ""
  codex_executable: codex
  # Discovery and Research need Gaia/LKM and web retrieval. Their writes remain
  # confined to the isolated checkout and prompts require read-only behavior.
  networked_sandbox: workspace-write
  network_access: true
  workers: 3
  # Caps concurrent networked agents (Discovery, strategy search, Research) across every
  # parallel region (domain discovery, triage, audit chains);
  # defaults to workers. Non-networked roles are not throttled.
  networked_workers: 2
  # Failed agent invocations retry with exponential backoff
  # (retry_backoff_seconds * 2^attempt); unusable structured output is a
  # contract failure and is never retried.
  retries: 1
  retry_backoff_seconds: 5
  # Canonicalization, Triage, and Reviewer do not need shell network access.
  sandbox: read-only
  timeout_seconds: 3600

outputs:
  runs_root: ../../open-research-problem-pool/campaigns
  problem_root: ../..
  pool_root: ../../open-research-problem-pool
