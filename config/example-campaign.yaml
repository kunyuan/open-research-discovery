schema_version: 1
name: quantum-information-open-problems

domains:
  - id: quantum-information
    query: >-
      Find important research papers in quantum information that explicitly
      formulate open questions whose proposed answers are independently
      checkable from a finite result, bounded derivation, or implementable CI
      contract. Return papers, not inferred open questions.
    seed_papers: []

limits:
  papers_per_domain: 10
  questions_per_domain: 100
  lkm_timeout_seconds: 60

agents:
  model: ""
  codex_executable: codex
  # Discovery and Research need Gaia/LKM and web retrieval. Their writes remain
  # confined to the isolated checkout and prompts require read-only behavior.
  networked_sandbox: workspace-write
  network_access: true
  workers: 3
  # Canonicalization, Triage, and Reviewer do not need shell network access.
  sandbox: read-only
  timeout_seconds: 3600

outputs:
  runs_root: ../../open-research-problem-pool/campaigns
  problem_root: ../..
  pool_root: ../../open-research-problem-pool
