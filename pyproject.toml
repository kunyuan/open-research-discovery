[project]
name = "open-research-discovery"
version = "0.2.0"
description = "Turn audited cross-disciplinary open questions into agent-ready Git repositories"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
]

[project.scripts]
discovery = "open_research_discovery.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_research_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
