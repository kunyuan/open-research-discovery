schema_version: 2
name: sign-problem-kimi-smoke

topics:
  - id: sign-problem
    title: Fermion Sign Problem
    query: >-
      Find context-grounded, currently open research problems about the
      fermion sign problem in quantum Monte Carlo and related many-body
      methods. Preserve the source's actual scope and decompose broad
      programs into concrete questions with unambiguous acceptance
      standards.
    sources:
      - topic_search
    seed_papers: []
    seed_references: []

limits:
  papers_per_domain: 5
  questions_per_domain: 20
  leads_per_topic: 5
  max_decomposition_depth: 1
  max_audited_candidates_per_topic: 2
  lkm_timeout_seconds: 60

agents:
  backend: kimi
  kimi_executable: /Users/bytedance/.kimi-code/bin/kimi
  model: ''
  # Inert placeholders: schema unconditionally requires codex-only fields
  # (codex_executable/sandbox) even when backend=kimi; they are unused by the
  # kimi backend (campaign.py only reads them when backend == "codex").
  codex_executable: codex
  sandbox: read-only
  workers: 3
  networked_workers: 3
  retries: 1
  retry_backoff_seconds: 5
  timeout_seconds: 1200

outputs:
  runs_root: /Users/bytedance/open-research-discovery/work/campaigns
  problem_root: /Users/bytedance/open-research-discovery/work/problems
  pool_root: ''
